# Peripheral-half-only Kconfig. Merged ON TOP of lily58.conf for the right build only
# (ZMK appends every matching <shield>.conf — unlike overlays, it does NOT stop at the
# first match — and later files win). The left half never sees any of this.
#
# Everything here drives the right-hand nice!view, which shows battery + an animation.
# Full reference: docs/zmk-nice-oled.md

# --- TEMPORARY: diagnosing right-half battery stuck at 0% (2026-08-18) ---
# ZMK's own battery.c only updates/reports state_of_charge when the ADC sensor fetch
# succeeds; on failure it just LOG_DBG()s and leaves the last-known value (0 if it has
# never succeeded) in place — silent unless USB serial logging is on. DBG is already
# ZMK's default log level (app/Kconfig, CONFIG_ZMK_LOG_LEVEL=4), so this just needs the
# USB CDC ACM backend turned on to see it. REMOVE once diagnosed — costs power otherwise.
CONFIG_ZMK_USB_LOGGING=y

# --- Peripheral animation (zmk-nice-oled) ---
# ⚠️ The module picks exactly ONE animation through an #elif chain in widgets/animation.c,
# in this priority order:
#
#     HEAD  >  CAT  >  SPACEMAN  >  POKEMON  >  gem/crystal (the #else fallback)
#
# CAT defaults to y, so switching to any lower-priority animation means setting the ones
# above it to n as well — otherwise you silently keep the cat. Two more traps:
#   - CONFIG_..._ANIMATION_PERIPHERAL_GEM is a NO-OP. There is no branch for it; the gem is
#     just what you land on when HEAD/CAT/SPACEMAN/POKEMON are all n.
#   - CONFIG_..._SMART_BATTERY=y #if-outs the entire animation file (upstream issue #31) and
#     the module author advises against it — it exhausts RAM and blacks the screen out.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=n

# Full loop length. Lower = faster = more CPU = less peripheral battery.
# Sensible per-animation values: cat/gem 960, head/spaceman 4800, pokemon 10000.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=4800

# To switch animations, comment the SPACEMAN block above and uncomment ONE of these:
#
#   cat (the old default, 960ms loop):
#     CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=n
#     CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y
#     CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=960
#
#   pokemon (48 frames, biggest — ~12KB flash):
#     CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=n
#     CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y
#     CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=10000
#
#   head (16 frames):
#     CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=y
#     CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=4800
#
#   gem/crystal (16 frames — the fallback, so just turn every animation above off):
#     CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=n
#
# Best battery life: swap the animation for a still picture. The memory-in-pixel panel
# holds a static image for free, so this costs almost no CPU at all.
#     CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
#     CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y
#     CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=y
