# Central-half-only Kconfig. Merged ON TOP of lily58.conf for the left build only
# (ZMK appends every matching <shield>.conf — unlike overlays, it does NOT stop at the
# first match — and later files win). The right half never sees any of this.

# --- 3 BLE host profiles instead of ZMK's default 5 ---
# ZMK computes host profiles as BT_MAX_PAIRED - ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS
# (see app/include/zmk/ble.h). The split central defaults to BT_MAX_PAIRED=6 with
# 1 peripheral = 5 profiles; 4 - 1 = 3. Kept on the left only so the right half stays
# at its own default of 1 paired device (it only ever bonds to the left).
# The keymap exposes exactly &bt BT_SEL 0..2 to match; the nice!view profile widget
# adapts on its own (it draws MIN(5, profile count) dots).
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_CONN=4
