# Central-half-only Kconfig. Merged ON TOP of lily58.conf for the left build only
# (ZMK appends every matching <shield>.conf — unlike overlays, it does NOT stop at the
# first match — and later files win). The right half never sees any of this.

# --- 3 BLE host profiles instead of ZMK's default 5 ---
# ZMK computes host profiles as BT_MAX_PAIRED - ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS
# (see app/include/zmk/ble.h). The split central defaults to BT_MAX_PAIRED=6 with
# 1 peripheral = 5 profiles; 4 - 1 = 3. Kept on the left only so the right half stays
# at its own default of 1 paired device (it only ever bonds to the left).
# The keymap exposes exactly &bt BT_SEL 0..2 to match; the nice!view profile widget
# adapts on its own (it draws MIN(5, profile count) dots).
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_CONN=4

# --- nice!view central screen (zmk-nice-oled) ---
# These symbols only EXIST on a central build: the module's Kconfig wraps them in
# `if !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL`. Setting them in the shared lily58.conf
# would warn about undefined symbols on the right half, hence they live here.

# Live modifier indicators — which of Ctrl/Shift/Opt/Cmd are held right now, as real
# macOS glyphs in a 2x2 box. The single most useful thing this module adds over stock,
# because it makes the homerow mods visible while you hold them.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_BOX=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=y
# Layout alternatives to the 2x2 box (pick exactly one, they are a Kconfig choice):
# CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_HOR=y   # one row
# CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_VER=y   # stacked column
# Letters (C/S/A/G) instead of glyphs:
# CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_LETTER=y

# Typing speed as a needle gauge. WPM_NUMBER adds a numeric readout underneath, but its
# default Y (103) sits right on top of the modifier box (110) — turn it on only if there's
# room, or move it with CONFIG_NICE_OLED_WIDGET_WPM_LABEL_CUSTOM_Y.
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
# CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n

# ⚠️ Luna the dog and Bongo Cat are deliberately OFF. Upstream issue #30: on nice_epaper,
# WPM Luna FREEZES while typing whenever the fixed modifier row is enabled — the modifier
# listener redraws and software-rotates the whole canvas on every keypress and starves the
# animation. You get modifiers OR Luna, not both. Modifiers won.
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_BONGO_CAT=n

# CapsLock indicator, no animation attached to it.
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT=n

# Current layer name (reads the keymap's display-name: Base / Lower / Raise).
CONFIG_NICE_OLED_WIDGET_LAYER=y

# ⚠️ Do not enable RESPONSIVE_BONGO_CAT — it cannot link. Its asset file is commented out
# of the module's CMakeLists and the symbols the widget references (bongo_cat_both1_90 and
# friends) are defined nowhere in the repo. Verified 2026-08-07, unreported upstream.
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n

# Raw HID (host clock, volume, keyboard layout, macOS weather + Spotify) needs a companion
# daemon running on the Mac and ~1KB more RAM. Off until it's actually wanted.
CONFIG_NICE_OLED_WIDGET_RAW_HID=n
