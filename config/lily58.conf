# Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# --- Latency: stop keystrokes arriving in bursts ---
# ZMK's defaults let the keyboard skip up to 30 connection events (BT_PERIPHERAL_PREF_LATENCY=30)
# at a 7.5-15 ms interval — up to ~450 ms of silence, which the host then flushes as a chunk.
# Ask the host for a fixed 7.5 ms interval (6 x 1.25 ms) and no skipped events.
# Costs battery on the central (left) half; raise LATENCY back toward 30 to trade latency for runtime.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# --- Displays (nice!view) ---
# One line is all it takes: the `nice_view` shield's own Kconfig.defconfig already selects its
# custom status screen AND the dedicated display work queue (so screen redraws can't stall keys).
CONFIG_ZMK_DISPLAY=y

# --- Battery reporting ---
# Each half's own battery is already on (ZMK_BLE implies ZMK_BATTERY_REPORTING) and shows on its
# own nice!view. These two make the LEFT half also collect the right half's level and report it
# to the host, so macOS shows both halves under Bluetooth.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

# --- Rotary encoder (EC12) — LEFT half only ---
# The stock lily58 shield already defines left_encoder + the sensors node, and lily58_left.overlay
# enables it, so these two lines plus sensor-bindings in the keymap are the whole job.
# ZMK calls it EC11 in config, but EC12 (Low Profile), EC11 or similar will work.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
